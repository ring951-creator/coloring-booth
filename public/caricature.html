<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청사진의 시대 — 캐리커처 만들기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');
  :root{
    --navy:#0f2540; --prussian:#1b3a6b; --paper:#fdf8ed; --paper-dim:#f2ead6;
    --sun:#f2c14e; --ink:#1a1a1a; --line:#cdbfa0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--navy);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(242,193,78,0.06), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(27,58,107,0.4), transparent 45%);
    font-family:'Noto Sans KR', sans-serif; color:var(--ink); padding:32px 16px 64px;
  }
  .wrap{ max-width:880px; margin:0 auto; }
  header{ text-align:center; color:var(--paper); margin-bottom:24px; }
  .eyebrow{ font-size:12px; letter-spacing:0.25em; color:var(--sun); text-transform:uppercase; margin-bottom:10px; }
  h1{ font-family:'Playfair Display', serif; font-size:clamp(26px,5vw,38px); margin:0 0 8px; font-weight:700; }
  .sub{ color:#c9d4e6; font-size:14px; margin:0; }
  .card{ background:var(--paper); border-radius:4px; padding:26px; box-shadow:0 20px 60px rgba(0,0,0,0.35); border:1px solid var(--line); }
  .step-label{ font-family:'Playfair Display', serif; font-size:13px; color:var(--prussian); letter-spacing:0.08em; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .step-label::before{ content:''; width:18px; height:1px; background:var(--prussian); }
  .upload-zone{ border:2px dashed var(--line); border-radius:4px; padding:24px 16px; text-align:center; background:var(--paper-dim); margin-bottom:20px; }
  .upload-zone p{ margin:0 0 14px; font-size:13px; color:#6b6250; }
  input[type=file]{ display:none; }
  .btn{ display:inline-flex; align-items:center; gap:8px; background:var(--prussian); color:var(--paper); border:none; padding:12px 24px; border-radius:3px; font-size:14px; font-weight:500; cursor:pointer; }
  .btn:hover{ background:var(--navy); }
  .btn:disabled{ background:#b9b2a0; cursor:not-allowed; }
  .btn.secondary{ background:transparent; color:var(--prussian); border:1px solid var(--prussian); }
  .btn.secondary:hover{ background:rgba(27,58,107,0.06); }
  .btn-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .status{ text-align:center; font-size:13px; color:#6b6250; margin:12px 0 0; min-height:18px; line-height:1.6; }
  .status.error{ color:#b0433a; font-weight:500; }
  .status.warn{ color:#8a6a1f; font-weight:500; }
  .spinner{ display:none; flex-direction:column; align-items:center; gap:10px; color:#6b6250; font-size:13px; padding:30px 0; }
  .spinner.active{ display:flex; }
  .spinner .ring{ width:30px; height:30px; border:3px solid var(--line); border-top-color:var(--prussian); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .variant-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:10px; }
  @media (max-width:520px){ .variant-grid{ grid-template-columns:1fr; } }
  .variant-card{ border:2px solid var(--line); border-radius:6px; overflow:hidden; cursor:pointer; background:white; transition:border-color 0.15s ease, transform 0.1s ease; }
  .variant-card:hover{ border-color:var(--prussian); }
  .variant-card.selected{ border-color:var(--sun); box-shadow:0 0 0 3px rgba(242,193,78,0.5); }
  .variant-card img{ width:100%; display:block; aspect-ratio:1/1; object-fit:cover; }
  .variant-card .label{ text-align:center; font-size:12.5px; padding:8px; color:var(--navy); font-weight:500; }
  .variant-card.style-pick{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 12px; gap:8px; aspect-ratio:1/1; }
  .variant-card.style-pick .emoji{ font-size:36px; }
  .variant-card.style-pick .label{ font-size:14px; padding:0; }

  .controls{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:18px; margin:18px 0; }
  .control{ background:var(--paper-dim); border-radius:4px; padding:12px 14px; }
  .control label{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:500; margin-bottom:6px; color:var(--navy); }
  .control label span.val{ color:var(--prussian); font-family:'Playfair Display', serif; }
  input[type=range]{ width:100%; accent-color:var(--prussian); }

  .preview-frame{ position:relative; background:repeating-conic-gradient(#e8e0cb 0% 25%, #f2ead6 0% 50%) 0 0/16px 16px; border:1px solid var(--line); border-radius:4px; padding:14px; display:flex; justify-content:center; align-items:center; min-height:220px; }
  canvas, img.selpreview{ max-width:100%; display:block; background:white; box-shadow:0 6px 20px rgba(0,0,0,0.15); }
  .placeholder{ color:#9c937d; font-size:13px; text-align:center; }
  footer{ text-align:center; color:#7c8aa5; font-size:12px; margin-top:24px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">AI Caricature → Cyanotype Line Art</div>
    <h1>청사진의 시대</h1>
    <p class="sub">사진을 찍으면 AI가 4가지 캐리커처로 그려드려요, 마음에 드는 걸 골라 선그림으로 바꿔보세요</p>
  </header>

  <div class="card">

    <!-- STEP 1: 업로드 -->
    <div id="stepUpload">
      <div class="step-label">1. 사진 넣기</div>
      <div class="upload-zone">
        <p>얼굴 사진을 선택하거나 바로 촬영하세요</p>
        <div class="btn-row">
          <label class="btn" for="fileInput">사진 선택 / 촬영</label>
        </div>
        <input type="file" id="fileInput" accept="image/*">
      </div>
      <p class="status" id="statusText1"></p>
    </div>

    <!-- STEP 2: 스타일 선택 -->
    <div id="stepChoose" class="hidden">
      <div class="step-label">2. 원하는 스타일 고르기 (고르면 그때 AI가 그려요)</div>
      <div class="variant-grid" id="variantGrid"></div>
      <div class="spinner" id="spinnerGen"><div class="ring"></div><span>AI가 그리는 중... (10~20초 정도 걸려요)</span></div>
      <p class="status" id="statusText2"></p>
      <div class="btn-row">
        <button class="btn secondary" id="restartBtn">처음부터 다시</button>
      </div>
    </div>

    <!-- STEP 3: 흑백 변환 -->
    <div id="stepBW" class="hidden">
      <div class="step-label">3. 흑백 잉크 스타일로 바꾸기 (청사진용)</div>

      <div class="spinner" id="spinnerInk"><div class="ring"></div><span>AI가 흑백 잉크 스타일로 다시 그리는 중... (10~20초 정도 걸려요)</span></div>
      <p class="status" id="statusText3"></p>

      <div id="inkResultWrap" class="hidden">
        <div class="preview-frame">
          <img id="inkResultImg" class="selpreview" alt="흑백 잉크 스타일 결과">
        </div>
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn secondary" id="useOfflineInsteadBtn">대신 오프라인 방식으로 만들기</button>
        </div>
      </div>

      <div id="offlineWrap" class="hidden">
        <div class="controls">
          <div class="control">
            <label>매끄럽게 <span class="val" id="smoothVal">2</span></label>
            <input type="range" id="smoothRange" min="0" max="4" value="2">
          </div>
          <div class="control">
            <label>선 진하기 <span class="val" id="threshVal">45</span></label>
            <input type="range" id="threshRange" min="10" max="90" value="45">
          </div>
          <div class="control">
            <label>선 굵기 <span class="val" id="thickVal">1</span></label>
            <input type="range" id="thickRange" min="0" max="3" value="1">
          </div>
        </div>
        <div class="preview-frame" id="previewFrame">
          <canvas id="outputCanvas"></canvas>
        </div>
      </div>

      <div class="btn-row" style="margin-top:18px;">
        <button class="btn" id="downloadBtn">다운로드</button>
        <button class="btn secondary" id="backToChooseBtn">다른 스타일 고르기</button>
        <button class="btn secondary" id="restartBtn2">처음부터 다시</button>
      </div>
    </div>

  </div>

  <footer>촬영한 사진은 저장되지 않으며, 변환 후 서버에서 즉시 삭제됩니다</footer>
</div>

<canvas id="workCanvas" style="display:none;"></canvas>

<script>
const fileInput = document.getElementById('fileInput');
const spinnerGen = document.getElementById('spinnerGen');
const statusText1 = document.getElementById('statusText1');
const stepUpload = document.getElementById('stepUpload');
const stepChoose = document.getElementById('stepChoose');
const stepBW = document.getElementById('stepBW');
const variantGrid = document.getElementById('variantGrid');
const restartBtn = document.getElementById('restartBtn');
const restartBtn2 = document.getElementById('restartBtn2');
const backToChooseBtn = document.getElementById('backToChooseBtn');
const smoothRange = document.getElementById('smoothRange');
const threshRange = document.getElementById('threshRange');
const thickRange = document.getElementById('thickRange');
const smoothVal = document.getElementById('smoothVal');
const threshVal = document.getElementById('threshVal');
const thickVal = document.getElementById('thickVal');
const outputCanvas = document.getElementById('outputCanvas');
const workCanvas = document.getElementById('workCanvas');
const downloadBtn = document.getElementById('downloadBtn');
const spinnerInk = document.getElementById('spinnerInk');
const statusText3 = document.getElementById('statusText3');
const inkResultWrap = document.getElementById('inkResultWrap');
const inkResultImg = document.getElementById('inkResultImg');
const offlineWrap = document.getElementById('offlineWrap');
const useOfflineInsteadBtn = document.getElementById('useOfflineInsteadBtn');

let currentResultMode = null; // 'ai' | 'offline'

let selectedFile = null;   // 사용자가 찍은/고른 원본 사진 (File 객체) - 스타일 재선택 시 재사용
let selectedImage = null;  // 캐리커처 결과 dataURL (흑백 변환 전 단계 입력)

// 캐리커처 스타일 목록 (서버의 CARICATURE_STYLES와 동일한 id, 아이콘 표시용)
const CARICATURE_STYLES = [
  { id: 'cute-chibi', label: '귀여운 카툰', emoji: '🎨' },
  { id: 'watercolor', label: '수채화 일러스트', emoji: '🖌️' },
  { id: 'pop-art', label: '팝아트', emoji: '💥' },
  { id: 'pencil-sketch', label: '색연필 스케치', emoji: '✏️' }
];

function setStatus1(msg, level){
  statusText1.textContent = msg || '';
  statusText1.className = 'status' + (level ? ' ' + level : '');
}
function setStatus2(msg, level){
  statusText2.textContent = msg || '';
  statusText2.className = 'status' + (level ? ' ' + level : '');
}
function goToStep(step){
  stepUpload.classList.toggle('hidden', step !== 'upload');
  stepChoose.classList.toggle('hidden', step !== 'choose');
  stepBW.classList.toggle('hidden', step !== 'bw');
}

// 사진을 서버로 보내기 전, 너무 크면 자동으로 줄여서 업로드 용량 제한을 피함
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          if(!blob) return reject(new Error('이미지 압축 실패'));
          resolve(new File([blob], 'photo.jpg', { type: 'image/jpeg' }));
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 1단계: 사진은 저장만 해두고, 바로 스타일 선택 화면으로 이동 (아직 AI 호출 안 함)
fileInput.addEventListener('change', async (e) => {
  const rawFile = e.target.files[0];
  if(!rawFile) return;
  setStatus1('');
  try{
    selectedFile = await resizeImageFile(rawFile, 1024, 0.85);
  }catch(err){
    console.error(err);
    selectedFile = rawFile; // 압축 실패해도 원본으로 진행 시도
  }
  renderStylePicker();
  goToStep('choose');
});

function renderStylePicker(){
  variantGrid.innerHTML = '';
  setStatus2('');
  CARICATURE_STYLES.forEach(style => {
    const card = document.createElement('div');
    card.className = 'variant-card style-pick';
    card.innerHTML = `<div class="emoji">${style.emoji}</div><div class="label">${style.label}</div>`;
    card.addEventListener('click', () => generateStyle(style, card));
    variantGrid.appendChild(card);
  });
}

// 2단계: 스타일 하나를 고르면, 그 스타일 "하나만" AI에게 요청
async function generateStyle(style, cardEl){
  document.querySelectorAll('.variant-card').forEach(c => c.classList.remove('selected'));
  cardEl.classList.add('selected');
  setStatus2('');
  spinnerGen.classList.add('active');

  try{
    const formData = new FormData();
    formData.append('photo', selectedFile);
    formData.append('style', style.id);
    const res = await fetch('/api/caricature', { method: 'POST', body: formData });
    const data = await res.json();

    spinnerGen.classList.remove('active');

    if(res.ok && data.image){
      selectedImage = data.image;
      goToStep('bw');
      runAiInkConversion();
      return;
    }

    const msg = data.error === 'REFUSED'
      ? 'AI가 이 스타일 생성을 거부했어요. 다른 스타일이나 다른 사진으로 시도해주세요.'
      : (data.message || 'AI 서버에 연결하지 못했어요.');
    setStatus2(msg, 'error');

  }catch(err){
    console.error(err);
    spinnerGen.classList.remove('active');
    setStatus2('AI 서버에 연결하지 못했어요. wifi 연결을 확인해주세요.', 'error');
  }
}

async function runAiInkConversion(){
  statusText3.textContent = '';
  statusText3.className = 'status';
  inkResultWrap.classList.add('hidden');
  offlineWrap.classList.add('hidden');
  spinnerInk.classList.add('active');

  try{
    const res = await fetch('/api/inkify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageDataUrl: selectedImage })
    });
    const data = await res.json();
    spinnerInk.classList.remove('active');

    if(res.ok && data.image){
      currentResultMode = 'ai';
      inkResultImg.src = data.image;
      inkResultWrap.classList.remove('hidden');
      return;
    }

    const msg = data.error === 'REFUSED'
      ? 'AI가 이 스타일 변환을 거부했어요.'
      : 'AI 서버 연결에 실패했어요.';
    statusText3.textContent = msg + ' — 오프라인 방식으로 대신 만들게요.';
    statusText3.className = 'status warn';
    await runOfflineConversion();

  }catch(err){
    console.error(err);
    spinnerInk.classList.remove('active');
    statusText3.textContent = 'AI 서버 연결에 실패했어요 — 오프라인 방식으로 대신 만들게요.';
    statusText3.className = 'status warn';
    await runOfflineConversion();
  }
}

useOfflineInsteadBtn.addEventListener('click', () => {
  inkResultWrap.classList.add('hidden');
  runOfflineConversion();
});

restartBtn.addEventListener('click', resetAll);
restartBtn2.addEventListener('click', resetAll);
backToChooseBtn.addEventListener('click', () => {
  renderStylePicker();
  goToStep('choose');
});

function resetAll(){
  fileInput.value = '';
  selectedFile = null;
  selectedImage = null;
  setStatus1('');
  goToStep('upload');
}

// ---------- 흑백 선그림 변환 (기존 오프라인 DoG 알고리즘 재사용) ----------
[smoothRange, threshRange, thickRange].forEach(r => {
  r.addEventListener('input', () => {
    smoothVal.textContent = smoothRange.value;
    threshVal.textContent = threshRange.value;
    thickVal.textContent = thickRange.value;
    if(selectedImage && currentResultMode === 'offline') runOfflineConversion();
  });
});

async function runOfflineConversion(){
  currentResultMode = 'offline';
  offlineWrap.classList.remove('hidden');

  const img = await loadImage(selectedImage);
  const { w, h } = drawToWorkCanvas(img, 700);
  const ctx = workCanvas.getContext('2d');
  const imageData = ctx.getImageData(0, 0, w, h);
  const gray = toGrayscale(imageData, w, h);

  const sigma = 1 + parseInt(smoothRange.value, 10) * 1.3;
  const mag = dogEdges(gray, w, h, sigma);
  const bin = threshold(mag, w, h, parseInt(threshRange.value, 10));
  const closed = erode(dilate(bin, w, h, 1), w, h, 1);
  const thickness = parseInt(thickRange.value, 10);
  const finalMask = thickness > 0 ? dilate(closed, w, h, thickness) : closed;

  const outData = toImageData(finalMask, w, h);
  outputCanvas.width = w;
  outputCanvas.height = h;
  outputCanvas.getContext('2d').putImageData(outData, 0, 0);
}

downloadBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  if(currentResultMode === 'ai'){
    link.download = 'caricature-ink.png';
    link.href = inkResultImg.src;
  } else {
    link.download = 'caricature-line-art.png';
    link.href = outputCanvas.toDataURL('image/png');
  }
  link.click();
});

function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function drawToWorkCanvas(img, maxDim){
  let w = img.width, h = img.height;
  const scale = Math.min(1, maxDim / Math.max(w, h));
  w = Math.round(w * scale); h = Math.round(h * scale);
  workCanvas.width = w; workCanvas.height = h;
  workCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return { w, h };
}
function toGrayscale(imageData, w, h){
  const { data } = imageData;
  const gray = new Float32Array(w*h);
  for(let i=0;i<w*h;i++) gray[i] = 0.299*data[i*4] + 0.587*data[i*4+1] + 0.114*data[i*4+2];
  return gray;
}
function boxBlurRadius(src, w, h, radius){
  if(radius <= 0) return src;
  const temp = new Float32Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let sum=0, count=0;
    for(let dx=-radius; dx<=radius; dx++){
      const nx=x+dx;
      if(nx>=0 && nx<w){ sum+=src[y*w+nx]; count++; }
    }
    temp[y*w+x]=sum/count;
  }
  const out = new Float32Array(w*h);
  for(let x=0;x<w;x++) for(let y=0;y<h;y++){
    let sum=0, count=0;
    for(let dy=-radius; dy<=radius; dy++){
      const ny=y+dy;
      if(ny>=0 && ny<h){ sum+=temp[ny*w+x]; count++; }
    }
    out[y*w+x]=sum/count;
  }
  return out;
}
function gaussApprox(gray, w, h, sigma){
  const radius = Math.max(1, Math.round(sigma));
  let result = gray;
  for(let p=0;p<3;p++) result = boxBlurRadius(result, w, h, radius);
  return result;
}
function dogEdges(gray, w, h, sigma){
  const k = 1.6;
  const g1 = gaussApprox(gray, w, h, sigma);
  const g2 = gaussApprox(gray, w, h, sigma*k);
  const mag = new Float32Array(w*h);
  for(let i=0;i<w*h;i++) mag[i] = Math.abs(g1[i]-g2[i]);
  return mag;
}
function threshold(mag, w, h, threshPercent){
  const bin = new Uint8ClampedArray(w*h);
  let max=0;
  for(let i=0;i<mag.length;i++) if(mag[i]>max) max=mag[i];
  if(max===0) max=1;
  const cutoff=(threshPercent/100)*max;
  for(let i=0;i<mag.length;i++) bin[i] = mag[i]>cutoff ? 1:0;
  return bin;
}
function dilate(bin, w, h, iterations){
  let cur = bin;
  for(let it=0; it<iterations; it++){
    const next = new Uint8ClampedArray(w*h);
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      let v=0;
      for(let dy=-1; dy<=1 && !v; dy++) for(let dx=-1; dx<=1 && !v; dx++){
        const nx=x+dx, ny=y+dy;
        if(nx>=0&&nx<w&&ny>=0&&ny<h&&cur[ny*w+nx]) v=1;
      }
      next[y*w+x]=v;
    }
    cur=next;
  }
  return cur;
}
function erode(bin, w, h, iterations){
  let cur = bin;
  for(let it=0; it<iterations; it++){
    const next = new Uint8ClampedArray(w*h);
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      let v=1;
      for(let dy=-1; dy<=1 && v; dy++) for(let dx=-1; dx<=1 && v; dx++){
        const nx=x+dx, ny=y+dy;
        if(nx<0||nx>=w||ny<0||ny>=h||!cur[ny*w+nx]) v=0;
      }
      next[y*w+x]=v;
    }
    cur=next;
  }
  return cur;
}
function toImageData(bin, w, h){
  const data = new Uint8ClampedArray(w*h*4);
  for(let i=0;i<w*h;i++){
    const v = bin[i] ? 0 : 255;
    data[i*4]=v; data[i*4+1]=v; data[i*4+2]=v; data[i*4+3]=255;
  }
  return new ImageData(data, w, h);
}
